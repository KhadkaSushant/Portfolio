<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Image Slideshow</title>
    <style>
   .about-image {
    position: relative;
    width: 350px; /* Adjust based on your layout */
    height: 450px;
    margin: 50px auto;
}

/* Styling for your mint background shape */
.bg-shape.mint-shape {
    position: absolute;
    top: -20px;
    left: -20px;
    width: 100%;
    height: 100%;
    background-color: #a8f5e7; /* Mint color */
    border-radius: 20px;
    z-index: 1;
}

/* Styling for the changing profile image */
.about-image img {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 20px;
    z-index: 2; /* Keeps image on top of the mint shape */
    box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.15);
    
    /* Smooth fade transition */
    transition: opacity 0.5s ease-in-out;
    opacity: 1;
}

/* Class triggered by JS to handle the fade effect */
.about-image img.fade-out {
    opacity: 0;
}
</style>
</head>
<body>

    <div class="about-image">
    <div class="bg-shape mint-shape"></div>
    <!-- Added id="profile-img" for JavaScript targeting -->
    <img id="profile-img" src="Sushant_portfolio_images/profile 1.jpg" alt="Designer Profile">
</div>

    <!-- <script src="script.js"></script> -->
    <script>
    // Array containing the paths to your different profile pictures
const images = [
    "Sushant_portfolio_images/profile 1.jpg",
    "Sushant_portfolio_images/profile 2.jpg",
    "Sushant_portfolio_images/profile 3.jpg"
];

let currentIndex = 0;
const imgElement = document.getElementById("profile-img");

function changeImage() {
    // 1. Trigger fade-out effect
    imgElement.classList.add("fade-out");

    setTimeout(() => {
        // 2. Change the image source after the fade-out starts
        currentIndex = (currentIndex + 1) % images.length;
        imgElement.src = images[currentIndex];

        // 3. Bring back the opacity (fade-in)
        imgElement.classList.remove("fade-out");
    }, 500); // Matches the 0.5s CSS transition time
}

// Change image every 3 seconds (3000 milliseconds)
setInterval(changeImage, 3000);
</script> 
</body>
</html>
