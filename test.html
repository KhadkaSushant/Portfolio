  <style>/* Reset & Base Styles */
.navbar {
  /* Position fixed or sticky so content scrolls underneath */
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  z-index: 1000;

  /* Glassmorphism styling */
  background: rgba(255, 255, 255, 0.15); /* Semi-transparent background */
  backdrop-filter: blur(12px);          /* Blurs elements behind the navbar */
  -webkit-backdrop-filter: blur(12px);  /* Safari support */

  /* Glass edge details */
  border-bottom: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);

  /* Layout spacing */
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
}

 </style>  <!-- Google Fonts for Typography matching -->
